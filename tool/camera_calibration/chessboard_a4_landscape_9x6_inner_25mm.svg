<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    version="1.1"
    width="297mm"
    height="210mm"
    viewBox="0 0 297 210">
  <!--
    Printable calibration chessboard
    Paper size: A4 landscape
    Inner corners: 9 x 6
    Square grid: 10 x 7
    Square size: 25 mm
    Print at 100% scale with no page fitting.
  -->
  <rect x="0" y="0" width="297" height="210" fill="#ffffff"/>

  <!-- Board origin: centered on page -->
  <g transform="translate(23.5,17.5)">
    <rect x="0" y="0" width="250" height="175" fill="#ffffff"/>
    <rect x="0" y="0" width="25" height="25" fill="#000000"/>
    <rect x="50" y="0" width="25" height="25" fill="#000000"/>
    <rect x="100" y="0" width="25" height="25" fill="#000000"/>
    <rect x="150" y="0" width="25" height="25" fill="#000000"/>
    <rect x="200" y="0" width="25" height="25" fill="#000000"/>

    <rect x="25" y="25" width="25" height="25" fill="#000000"/>
    <rect x="75" y="25" width="25" height="25" fill="#000000"/>
    <rect x="125" y="25" width="25" height="25" fill="#000000"/>
    <rect x="175" y="25" width="25" height="25" fill="#000000"/>
    <rect x="225" y="25" width="25" height="25" fill="#000000"/>

    <rect x="0" y="50" width="25" height="25" fill="#000000"/>
    <rect x="50" y="50" width="25" height="25" fill="#000000"/>
    <rect x="100" y="50" width="25" height="25" fill="#000000"/>
    <rect x="150" y="50" width="25" height="25" fill="#000000"/>
    <rect x="200" y="50" width="25" height="25" fill="#000000"/>

    <rect x="25" y="75" width="25" height="25" fill="#000000"/>
    <rect x="75" y="75" width="25" height="25" fill="#000000"/>
    <rect x="125" y="75" width="25" height="25" fill="#000000"/>
    <rect x="175" y="75" width="25" height="25" fill="#000000"/>
    <rect x="225" y="75" width="25" height="25" fill="#000000"/>

    <rect x="0" y="100" width="25" height="25" fill="#000000"/>
    <rect x="50" y="100" width="25" height="25" fill="#000000"/>
    <rect x="100" y="100" width="25" height="25" fill="#000000"/>
    <rect x="150" y="100" width="25" height="25" fill="#000000"/>
    <rect x="200" y="100" width="25" height="25" fill="#000000"/>

    <rect x="25" y="125" width="25" height="25" fill="#000000"/>
    <rect x="75" y="125" width="25" height="25" fill="#000000"/>
    <rect x="125" y="125" width="25" height="25" fill="#000000"/>
    <rect x="175" y="125" width="25" height="25" fill="#000000"/>
    <rect x="225" y="125" width="25" height="25" fill="#000000"/>

    <rect x="0" y="150" width="25" height="25" fill="#000000"/>
    <rect x="50" y="150" width="25" height="25" fill="#000000"/>
    <rect x="100" y="150" width="25" height="25" fill="#000000"/>
    <rect x="150" y="150" width="25" height="25" fill="#000000"/>
    <rect x="200" y="150" width="25" height="25" fill="#000000"/>
  </g>
</svg>
